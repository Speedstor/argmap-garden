    claim: written-chance-corrects-more
    note: "Four parts, all needed: outcomes differ from what was expected, the expectation is lost unless written, a recorded miss acts on the map, and misses do get recorded."
    verdict: stands
    bets: 4
    sharp: 4
  - at: 2026-11-16
    by: tt-aldrin-surveyor
    did: dispute
    claim: notes-do-the-work
    note: Not known which is right. This is the question the loop is run to answer.
    verdict: contested
    bets: 5
    sharp: 5
  - at: 2026-11-16
    by: tt-aldrin-surveyor
    did: dispute
    claim: picks-easy-tests
    note: The rule settles which bet, not how hard the test is, so the two stay in dispute.
    verdict: contested
    bets: 7
    sharp: 7
  - at: 2026-11-16
    by: tt-aldrin-surveyor
    did: dispute
    claim: same-judge
    note: "A count narrows the judgment and does not remove it: which cases are drawn and what counts as agreeing are still read by the same model."
    verdict: contested
    bets: 9
    sharp: 9
  - at: 2026-11-16
    by: tt-aldrin-surveyor
    did: predict
    claim: outcomes-surprise
    note: "60%: Of the first 30 tests this loop resolves in this file, at least 6 end on the side that their written chance put below one half."
    verdict: contested
    bets: 9
    sharp: 9
disputes:
  - [written-chance-corrects-more, notes-do-the-work]
  - [picks-easy-tests, next-picks-the-bet]
  - [same-judge, counted-tests]
attacks:
