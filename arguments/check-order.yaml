argmap: 1
title: Does argmap's order of checks find a flaw sooner than reading the bets top to bottom?
conclusion: order-finds-flaw-sooner

# Mapped by Claude on 16 Nov 2026 (UTC) in session_01UC9Vn7vvnk1MrY5GLhhHEk, signed with the cloud workspace key.
# It is about the trial in trials/check-order.mts. Every figure here can be reproduced with that script.
# The trial loop of the Thinking Tools project runs the same script every hour and keeps its own record elsewhere.

terms:
  check: Finding out whether one bet is true or false. Every check counts as 1, whatever effort it takes.
  argmap-order: "The order in which argmap report lists the bets, worked out again after each check: bets that can change the conclusion alone first, then the shakiest label as read, then the highest cost of being wrong, then the widest reach. The command argmap next ranks by it."
  file-order: The bets from top to bottom, as the tool lists the claims of the file.
  made-up: "Generated by trials/check-order.mts: a conclusion, lines of support, bets with trust labels, and 2 objections that each have a rebuttal. Each bet is secretly false with a chance set by its label: observed 3%, corroborated 10%, track-record 25%, assumed 40%."
  share: "The mean number of checks an order takes until the conclusion first matches the truth, divided by the same mean for file order, over the maps where the conclusion with nothing knocked out differs from the truth. The script prints it as shareOfFileOrder."

claims:
  order-finds-flaw-sooner:
    text: On a real map with 2 or more lines of support, a person who follows the {argmap-order} reaches the true conclusion in 60% or fewer of the {check|checks} that {file-order} takes.
    because: [lead-on-made-up-maps, lead-on-public-map, labels-track-failure, reader-reruns]

  lead-on-made-up-maps:
    text: On {made-up} maps with 2 lines of support and a name on every label, the {argmap-order} has a {share} of 0.60 or less.
    bet:
      trust: observed
      cost: high
      note: Run on 2 seeds of 300 maps each. The made-up maps and the link from a label to the chance of being false are inputs of the trial.
      by: claude-fable-5.2
    evidence:
      - kind: statistic
        says: Over 300 made-up maps with 2 lines of support the argmap order took 4.12 checks against 8.50 for file order on seed 1, a share of 0.48, and 3.87 against 8.39 on seed 2, a share of 0.46.
        value: 0.48
        unit: share of file order's checks
        sample: 300 made-up maps per seed, of which 208 and 224 were maps where the presumed conclusion differed from the truth
        period: 16 Nov 2026
        source: "Run in this repository: node trials/check-order.mts '{\"maps\":300,\"seed\":1,\"orGroups\":2}' and the same with seed 2"
        origin: trials/check-order.mts, seeds 1 and 2, orGroups 2
        by: claude-fable-5.2
        date: 2026-11-16
      - kind: account
        says: I ran the script on 16 Nov 2026 and read these figures off its output. Two later wakes of the trial loop ran the same options in fresh sessions and got the same figures.
        witness: claude-fable-5.2, in session_01UC9Vn7vvnk1MrY5GLhhHEk
        first_hand: true
        source: "Run in this repository: node trials/check-order.mts '{\"maps\":300,\"seed\":1,\"orGroups\":2}'"
        origin: trials/check-order.mts, seeds 1 and 2, orGroups 2
        by: claude-fable-5.2
        date: 2026-11-16
    predictions:
      - says: On each of seeds 11, 12 and 13, with 300 made-up maps and 2 lines of support, the script prints a shareOfFileOrder of 0.60 or less for the order named exposure.
        how: "Run in this repository, at the commit that recorded this test: node trials/check-order.mts '{\"maps\":300,\"seed\":11,\"orGroups\":2}' and the same with seeds 12 and 13. Yes when results.exposure.shareOfFileOrder is 0.6 or less in all 3 runs."
        type: lookup
        p: 0.93
        if_true: 0.97
        if_false: 0.15
        by: claude-fable-5.2
        kind: ai
        made: 2026-11-16
        due: 2026-11-17
        rev: 63eee8bc746e3736da34033ecc3d71f3
        accepted:
          - by: claude-fable-5.2
            kind: ai
            date: 2026-11-16
        outcome: yes
        resolved: 2026-11-16
        resolved_by: claude-fable-5.2
        resolved_kind: ai
        source: "Run at commit 4c139fd: node trials/check-order.mts '{\"maps\":300,\"seed\":11,\"orGroups\":2}' and the same with seeds 12 and 13"
        note: shareOfFileOrder for exposure was 0.479, 0.508 and 0.508.

  lead-on-public-map:
    text: On the structure and labels of the public map arguments/second-industrialization.yaml, with the truth of its 19 bets drawn at random by label, the {argmap-order} has a {share} of 0.60 or less.
    bet:
      trust: assumed
      cost: high
      note: The only real map of any size in this repository. Not run when this was written. The file option of the script was tried on an invented toy map only.
      by: claude-fable-5.2
    predictions:
      - says: With the truth drawn 1000 times on seed 1, the script prints a shareOfFileOrder of 0.60 or less for the order named exposure, and at least 50 of the 1000 draws are flip maps.
        how: "Run in this repository, at the commit that recorded this test: node trials/check-order.mts '{\"file\":\"arguments/second-industrialization.yaml\",\"maps\":1000,\"seed\":1}'. Yes when results.exposure.shareOfFileOrder is 0.6 or less and flipMaps is 50 or more. Otherwise no."
        type: lookup
        p: 0.4
        if_true: 0.97
        if_false: 0.05
        by: claude-fable-5.2
        kind: ai
        made: 2026-11-16
        due: 2026-11-17
        rev: 90030c71518b31ca33324c51db30f7ad
        accepted:
          - by: claude-fable-5.2
            kind: ai
            date: 2026-11-16
        outcome: no
        resolved: 2026-11-16
        resolved_by: claude-fable-5.2
        resolved_kind: ai
        source: "Run at commit 4c139fd: node trials/check-order.mts '{\"file\":\"arguments/second-industrialization.yaml\",\"maps\":1000,\"seed\":1}'"
        note: "shareOfFileOrder for exposure was 1.085: 3.10 checks against 2.85 for file order, over 992 flip maps of 1000. Paired, the argmap order took 0.24 more checks than file order, standard error 0.10. All 19 labels read as assumed, so the order had no label to use."

  labels-track-failure:
    text: On real maps, bets labelled assumed turn out false at 2 or more times the rate of bets labelled observed or corroborated.
    bet:
      trust: assumed
      cost: high
      note: "An input of the trial, not a finding. With the labels inverted the lead went: at 2 lines the argmap order took 9.9 checks against 10.2 for file order, and at 1 line it took 1.4 to 2.0 more than file order (wake 2 of the trial loop, 16 Nov 2026). The trial loop plans to measure this on the 19 bets of the public map."
      by: claude-fable-5.2

  reader-reruns:
    text: A person working through a map with argmap runs the command argmap next again after at least 8 of every 10 {check|checks}.
    bet:
      trust: assumed
      cost: medium
      note: At 3 lines of support the first list followed to the end took 9.2 checks, against 6.2 when worked out again each time and 10.0 for shakiest label first (wake 1 of the trial loop, 16 Nov 2026). Nobody has watched a person use the tool.
      by: claude-fable-5.2

  labels-mislead:
    text: On real maps, bets labelled assumed turn out false at a rate no higher than that of bets labelled observed or corroborated.
    bet:
      trust: assumed
      note: The rival. A label is typed by whoever wrote the claim, and nothing has yet compared labels with outcomes.
      by: claude-fable-5.2

  unnamed-labels-erase-lead:
    text: On real maps the labels carry no name, and without names the {argmap-order} loses its lead over {file-order}.
    because: [unnamed-order-slower, labels-go-unnamed]

  unnamed-order-slower:
    text: On {made-up} maps with 2 lines of support and no name on any label, the {argmap-order} has a {share} above 0.60.
    bet:
      trust: assumed
      cost: medium
      note: argmap reads a label above assumed with no name on it as assumed, so the order cannot use it. With 1 line of support the pilot gave 2.87 checks against 3.19 for file order, a share of 0.90. Not run at 2 lines when this was written.
      by: claude-fable-5.2
    predictions:
      - says: Over seeds 1 and 2, with 300 made-up maps each, 2 lines of support and no name on any label, the mean of the 2 values of shareOfFileOrder for the order named exposure is above 0.60.
        how: "Run in this repository, at the commit that recorded this test: node trials/check-order.mts '{\"maps\":300,\"seed\":1,\"orGroups\":2,\"named\":0}' and the same with seed 2. Take results.exposure.shareOfFileOrder from each run and average the 2. Yes when the average is above 0.6."
        type: lookup
        p: 0.62
        if_true: 0.95
        if_false: 0.1
        by: claude-fable-5.2
        kind: ai
        made: 2026-11-16
        due: 2026-11-17
        rev: 77943957f0875cf15e4910bfd283027e
        accepted:
          - by: claude-fable-5.2
            kind: ai
            date: 2026-11-16
        outcome: yes
        resolved: 2026-11-16
        resolved_by: claude-fable-5.2
        resolved_kind: ai
        source: "Run at commit 4c139fd: node trials/check-order.mts '{\"maps\":300,\"seed\":1,\"orGroups\":2,\"named\":0}' and the same with seed 2"
        note: shareOfFileOrder for exposure was 0.628 on seed 1 and 0.623 on seed 2, an average of 0.626. With names on the labels the same maps gave 0.484 and 0.461.

  labels-go-unnamed:
    text: In the public map arguments/second-industrialization.yaml, 9 of the 19 bets carry a label above assumed with no name on it.
    bet:
      trust: observed
      note: The other 10 are labelled assumed. So all 19 read as assumed, and the order cannot tell them apart by label.
      by: claude-fable-5.2
    evidence:
      - kind: statistic
        says: The report lists 19 bets. 9 are labelled track-record or corroborated and read as assumed because no name is on the label. 10 are labelled assumed.
        value: 9
        unit: bets of 19
        sample: every bet of arguments/second-industrialization.yaml at commit a2a300f
        period: 16 Nov 2026
        source: "Run in this repository: node bin/argmap.mjs report arguments/second-industrialization.yaml --json, and compare labelled with trust for each bet"
        by: claude-fable-5.2
        date: 2026-11-16
      - kind: account
        says: I ran the report on 16 Nov 2026 and counted the bets whose typed label differs from what it reads as.
        witness: claude-fable-5.2, in session_01UC9Vn7vvnk1MrY5GLhhHEk
        first_hand: true
        source: "Run in this repository: node bin/argmap.mjs report arguments/second-industrialization.yaml --json"
        by: claude-fable-5.2
        date: 2026-11-16

